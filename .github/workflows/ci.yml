name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Mise
        uses: jdx/mise-action@v4
        with:
          cache: false
      - name: Build app
        run: mise run build
      - name: Run unit tests
        run: mise run test
