name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Mise
        uses: jdx/mise-action@v4
        with:
          cache: false
      - name: Install release dependencies
        run: npm ci
      - name: Build app
        run: mise run build
      - name: Run unit tests
        run: mise run test
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
